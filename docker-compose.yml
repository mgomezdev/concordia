# Pull from Docker Hub (default):
#   docker compose up
#
# Build from local source (dev):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Bind-mount to ./<app> instead of named volumes (prod):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up

# Image refs are overridable so CI can pin the stack to a specific build
# (a PR's freshly-built image, or the `develop` tag for the nightly run)
# without editing this file. Defaults are the released Docker Hub images.

services:
  laminus:
    image: ${LAMINUS_IMAGE:-ninjabuffalo/laminus:latest}
    volumes:
      # user/ + plugins/ only — laminus redirects OrcaSlicer's own --datadir to a
      # disposable scratch path (see laminus/entrypoint.sh) and symlinks just these
      # two subtrees back in, so nothing lands in here but what's worth backing up.
      - laminus-config:/config
      - laminus-data:/data
      # Named volume caches the OrcaSlicer AppImage across restarts.
      # Re-downloaded only when ORCA_VERSION changes. Not worth backing up.
      - laminus-slicer:/opt/orcaslicer
    shm_size: "1gb"
    environment:
      - TZ=Etc/UTC
      - PYTHONUNBUFFERED=1
      - ORCA_VERSION=${ORCA_VERSION:-2.4.2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  themis:
    image: ${THEMIS_IMAGE:-ninjabuffalo/themis:latest}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - themis-data:/data
    environment:
      - LAMINUS_SIDECAR_URL=http://laminus:5000
      - THEMIS_LIBRARY_DIR=/data/library
      - THEMIS_BOOTSTRAP_KEY=${THEMIS_BOOTSTRAP_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      laminus:
        condition: service_healthy
    restart: unless-stopped

  ordinus:
    # Published as `gridfinity-customizer` by ordinus's own CI — `ninjabuffalo/ordinus`
    # has never existed, so `docker compose up` could not pull this service.
    image: ${ORDINUS_IMAGE:-ninjabuffalo/gridfinity-customizer:latest}
    ports:
      - "${ORDINUS_PORT:-3001}:80"
    volumes:
      - ordinus-config:/config
      - ordinus-data:/data
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=info
      - THEMIS_URL=http://themis:8000
      - PUBLIC_URL=http://localhost:${ORDINUS_PORT:-3001}
    healthcheck:
      # nginx serves on :80 inside the container (see ordinus/infra/Dockerfile `EXPOSE 80`).
      # ORDINUS_PORT is the *host* side of the mapping only — probing it in here never
      # succeeded, so `docker compose up --wait` hung on this service.
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      themis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  themis-data:
  laminus-config:
  laminus-data:
  laminus-slicer:
  ordinus-config:
  ordinus-data:
