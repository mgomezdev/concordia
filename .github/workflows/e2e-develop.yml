name: e2e (Themis + Laminus develop)

# The service PR workflows each test one freshly built artifact against the
# other service's released image. This workflow closes that gap by building
# both branch heads from source and exercising their real OrcaSlicer coupling.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "30 10 * * *" # nightly, after the published-image canary
  workflow_dispatch:
    inputs:
      themis_ref:
        description: Themis revision to build
        type: string
        default: develop
      laminus_ref:
        description: Laminus revision to build
        type: string
        default: develop
      concordia_ref:
        description: Concordia test-suite revision
        type: string
        default: main
      acceptance_only:
        description: Run only the real OrcaSlicer print-group acceptance cases
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.themis_ref || 'develop' }}-${{ inputs.laminus_ref || 'develop' }}
  cancel-in-progress: false

jobs:
  e2e-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Concordia
        uses: actions/checkout@v4
        with:
          repository: mgomezdev/concordia
          ref: ${{ inputs.concordia_ref || github.event.pull_request.head.sha || 'main' }}

      - name: Check out Themis
        uses: actions/checkout@v4
        with:
          repository: mgomezdev/themis
          ref: ${{ inputs.themis_ref || 'develop' }}
          path: .services/themis

      - name: Check out Laminus
        uses: actions/checkout@v4
        with:
          repository: mgomezdev/laminus
          ref: ${{ inputs.laminus_ref || 'develop' }}
          path: .services/laminus

      - name: Record tested revisions
        run: |
          echo "Concordia $(git rev-parse HEAD)"
          echo "Themis    $(git -C .services/themis rev-parse HEAD)"
          echo "Laminus   $(git -C .services/laminus rev-parse HEAD)"

      - name: Configure env
        run: cp .env.example .env

      - name: Select the engine version from the Laminus source revision
        run: |
          version=$(sed -nE 's/^ENV ORCA_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .services/laminus/Dockerfile)
          test -n "$version"
          echo "ORCA_VERSION=$version" >> "$GITHUB_ENV"
          echo "OrcaSlicer $version"

      - name: Restore OrcaSlicer AppImage cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/orcaslicer
          key: orcaslicer-${{ env.ORCA_VERSION }}

      - name: Build and start both develop services
        env:
          THEMIS_CONTEXT: .services/themis
          LAMINUS_CONTEXT: .services/laminus
        run: |
          mkdir -p .ci-cache/orcaslicer
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.develop.yml \
            up -d --build --wait laminus themis
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.develop.yml ps
          docker inspect --format '{{.Name}} {{.Image}}' $(docker compose \
            -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.develop.yml ps -q laminus themis)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install Playwright browser
        if: github.event_name != 'pull_request' && !inputs.acceptance_only
        run: playwright install --with-deps chromium

      - name: Run the three real OrcaSlicer print-group acceptance cases
        env:
          DEVELOP_STACK: "1"
          LAMINUS_URL: http://localhost:5100
        run: |
          pytest tests/e2e/test_real_orca_print_groups.py --integration --strict-markers -v -s -ra \
            --junitxml=real-orca-acceptance.xml
          python - <<'PY'
          from xml.etree.ElementTree import parse

          cases = parse("real-orca-acceptance.xml").findall(".//testcase")
          unfinished = [case.attrib["name"] for case in cases
                        if any(outcome.tag in {"skipped", "failure", "error"} for outcome in case)]
          assert len(cases) == 3 and not unfinished, (len(cases), unfinished)
          PY

      - name: Run develop coupling suite
        if: github.event_name != 'pull_request' && !inputs.acceptance_only
        env:
          DEVELOP_STACK: "1"
          LAMINUS_URL: http://localhost:5100
        run: pytest tests/e2e/ --integration -m "integration and not ordinus" -v --ignore=tests/e2e/test_real_orca_print_groups.py

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.develop.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.develop.yml down -v
